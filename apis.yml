name: AI Medical Service
description: 'AI Medical Service Inc. (AIM) is a Tokyo-based med-tech company founded in September
  2017 with the mission to save lives worldwide by eliminating gastrointestinal cancers through
  earlier detection. AIM develops endoscopic AI (artificial intelligence) that assists physicians
  in real-time diagnostic imaging of the digestive tract, drawing on joint research with more than
  100 medical institutions. Its flagship gastroAI family of endoscopic image diagnosis support
  software has secured regulatory approval in Japan, Singapore, and Thailand, and an earlier FDA
  approval in the United States. The company distributes its AI on-premise today and is building an
  in-house cloud platform to broaden access; it currently publishes no public developer API,
  OpenAPI specification, or developer portal. This API Evangelist profile tracks the company as a
  health-tech lead backed by SoftBank Vision Fund.'
